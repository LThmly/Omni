; PlatformIO Configuration File for Omni ESP32-S3 Firmware
; Board: Seeed Studio XIAO ESP32S3 Plus (16MB Flash, 8MB OPI PSRAM)
; Display: Adafruit 6382 4.2" Tri-Color E-Ink Display (SSD1683) via 4224 Friend
; Input: Same Sky TS43 Thumbwheel Navigation Switch (Up / Down / Push)
; Microphone: Adafruit 6049 I2S MEMS (ICS-43434)

[env:xiao_esp32s3_plus]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  adafruit/Adafruit EPD@^4.6.3
  adafruit/Adafruit GFX Library@^1.11.9
