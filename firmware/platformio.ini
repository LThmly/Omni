; XIAO ESP32-S3 Plus: 16MB flash, 8MB OPI PSRAM.
; The PlatformIO board id is the non-Plus module; flash size and memory type
; override it. Confirm on the first upload.

[env:xiao_esp32s3_plus]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_speed = 460800
