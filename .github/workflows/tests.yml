name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            cloud/requirements.txt
            sim/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud/requirements.txt "pygame-ce==2.5.8"
      - name: Firmware tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          OMNI_SPEAK: "0"
        run: python -m unittest discover -s firmware -p "test_*.py"
      - name: Cloud tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          OMNI_SPEAK: "0"
        run: python -m unittest discover -s cloud -p "test_*.py"
