<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Ink Display Simulator — Adafruit 6382 (300×400 Vertical Tri-Color)</title>
    <style>
        @font-face {
            font-family: 'Neuropolitical';
            font-style: normal;
            font-weight: 400;
            src: url('./dist/neuropolitical.woff') format('woff');
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            margin: 0 0 6px 0;
            font-weight: 300;
            font-size: 24px;
        }
        .spec-subtitle {
            margin: 0 0 20px 0;
            font-size: 13px;
            color: #9aa0b8;
        }
        .display-frame {
            background: #2d2d44;
            border-radius: 12px;
            padding: 20px;
            display: inline-block;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
        }
        #display {
            border: 2px solid #444;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
            transform-origin: top left;
            display: block;
        }
        .refresh-badge {
            position: absolute;
            top: 28px;
            right: 28px;
            background: rgba(20, 20, 35, 0.88);
            border: 1px solid #555;
            color: #fff;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 11px;
            font-family: ui-monospace, monospace;
            pointer-events: none;
            display: none;
        }
        .refresh-badge.active {
            display: inline-block;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        .control-group {
            background: #2d2d44;
            padding: 15px;
            border-radius: 8px;
        }
        .control-group.full-span {
            grid-column: 1 / -1;
        }
        .control-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            color: #9aa0b8;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .control-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #1a1a2e;
            color: #fff;
            font-size: 14px;
        }
        button {
            background: #4a90d9;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-right: 6px;
            margin-top: 6px;
        }
        button:hover { background: #3a7bc8; }
        button.secondary { background: #3b3b58; }
        button.secondary:hover { background: #4c4c70; }
        button.active-anim { background: #c40000; }
        button.active-design {
            background: #4a90d9;
            outline: 2px solid #9ad0ff;
        }
        .scale-buttons { margin-top: 10px; }
        .scale-buttons button { padding: 5px 12px; font-size: 12px; }
        .two-col {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 30px;
            align-items: start;
        }
        @media (max-width: 900px) {
            .two-col { grid-template-columns: 1fr; }
        }
        .links { margin-top: 20px; }
        .links a { color: #4a90d9; margin-right: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>E-Ink Display Simulator</h1>
        <p class="spec-subtitle">
            Adafruit 6382 • 4.2" Tri-Color E-Ink (300 × 400 px Vertical Portrait, SSD1683, Black / White / Red)
        </p>

        <div class="two-col">
            <div>
                <div class="display-frame">
                    <canvas id="display"></canvas>
                    <div id="refreshBadge" class="refresh-badge">FULL REFRESH</div>
                </div>
                <div class="scale-buttons">
                    <button onclick="setScale(1)">1x (300×400)</button>
                    <button onclick="setScale(2)">2x (600×800)</button>
                    <button onclick="setScale(3)">3x (900×1200)</button>
                </div>
            </div>

            <div class="controls">
                <div class="control-group full-span">
                    <label>High-Density Usable Multi-Icon Designs (Keys 1–5)</label>
                    <div style="font-size: 12px; color: #bbb; margin-bottom: 6px;">
                        See <strong>9 to 16 icons at the same time</strong> — scroll with <strong>ArrowUp / ArrowDown</strong>:
                    </div>
                    <button id="btnDesign1" class="secondary active-design" onclick="setAppLayout(1)">1. 12-Icon Matrix (3×4) + Bar</button>
                    <button id="btnDesign2" class="secondary" onclick="setAppLayout(2)">2. Hero Header + 9-Tile Grid (3×3)</button>
                    <button id="btnDesign3" class="secondary" onclick="setAppLayout(3)">3. 13-Icon Honeycomb Field</button>
                    <button id="btnDesign4" class="secondary" onclick="setAppLayout(4)">4. 16-Icon Compact Grid (4×4)</button>
                    <button id="btnDesign5" class="secondary" onclick="setAppLayout(5)">5. 10-App Dual-Column Pills (2×5)</button>
                    <div style="font-size: 11px; color: #888; margin: 8px 0 4px;">
                        Previous Wheel Arc Dials (Keys 6–0):
                    </div>
                    <button id="btnDesign6" class="secondary" onclick="setAppLayout(6)">6. 5-Node Right Dial</button>
                    <button id="btnDesign7" class="secondary" onclick="setAppLayout(7)">7. Omni Spoke Hub</button>
                    <button id="btnDesign8" class="secondary" onclick="setAppLayout(8)">8. Horizon Turntable</button>
                    <button id="btnDesign9" class="secondary" onclick="setAppLayout(9)">9. Detent Ring</button>
                    <button id="btnDesign10" class="secondary" onclick="setAppLayout(10)">0. Corner Thumb-Sweep</button>
                </div>

                <div class="control-group">
                    <label>Screen / Page</label>
                    <select id="scene" onchange="stopAnim(); render('full')">
                        <option value="agent">Agent View (Main Home Screen)</option>
                        <option value="apps" selected>App Selection Launcher</option>
                        <option value="shapes">Basic Shapes (Tri-Color)</option>
                        <option value="text">Text & GFX Fonts</option>
                        <option value="bitmap">Bitmap Drawing</option>
                        <option value="graph">Line Graph</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Thumbwheel Navigation (Partial Refresh)</label>
                    <div style="font-size: 12px; color: #bbb; margin-bottom: 4px;">
                        Use <strong>ArrowUp / ArrowDown</strong> to scroll apps:
                    </div>
                    <button class="secondary" onclick="scrollApps(-1)">▲ Wheel Up</button>
                    <button onclick="pressWheel()">● Wheel Push</button>
                    <button class="secondary" onclick="scrollApps(1)">▼ Wheel Down</button>
                    <div style="margin-top: 6px;">
                        <button class="secondary" onclick="addGeneratedApp()">+ Generate New App</button>
                        <button class="secondary" onclick="resetApps()">Reset (12 Apps)</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Home Logo Animations (~1.7 FPS)</label>
                    <button id="btnAnimSpin" class="secondary" onclick="toggleAnim('spin')">⟳ Spin Logo</button>
                    <button id="btnAnimPulse" class="secondary" onclick="toggleAnim('pulse')">Hub Core Pulse</button>
                    <button id="btnAnimOrbit" class="secondary" onclick="toggleAnim('orbit')">Arrow Step Cycle</button>
                    <button class="secondary" onclick="stopAnim(); render('full')">Full Refresh</button>
                </div>

                <div class="control-group">
                    <label>E-Ink Waveform & Mode</label>
                    <select id="waveformMode" style="margin-bottom: 8px;">
                        <option value="fast" selected>Realistic Partial (440ms) + Fast Full (2.2s)</option>
                        <option value="hardware">True Hardware Speed (550ms Partial / 10s Full)</option>
                        <option value="instant">Instant (No Waveform)</option>
                    </select>
                    <select id="mode" onchange="stopAnim(); render('full')">
                        <option value="light">Light (Black on White)</option>
                        <option value="dark">Dark (White on Black)</option>
                    </select>
                </div>
            </div>
        </div>

        <div style="margin-top: 20px;">
            <button onclick="sim.download()">Download PNG</button>
            <button onclick="sim.copyToClipboard().then(() => alert('Copied!'))">Copy to Clipboard</button>
        </div>

        <div class="links">
            <a href="https://github.com/slavik0329/eink-simulator">GitHub</a>
            <a href="https://www.npmjs.com/package/eink-simulator">npm</a>
        </div>
    </div>

    <script src="./dist/eink-simulator.bundle.js"></script>
    <script src="./dist/generated/font-data.js"></script>
    <script>
        const { EinkSimulator } = window.EinkSimulator;
        const DISPLAY_W = 300;
        const DISPLAY_H = 400;
        const RED = '#C40000';

        let sim;
        let currentScale = 2;
        let activeAnim = null;
        let animTimer = null;
        let animStep = 0;
        let spinAngleDeg = 0;
        let partialCountSinceFull = 0;
        let waveformRAF = null;

        // Current App Selection layout variation (1..5 Multi-Icon Usable Grids, 6..10 Wheel Arcs)
        let appLayoutVariant = 1;

        const INITIAL_APPS = [
            { id: 'omni',     title: 'omni',      icon: 'omni' },
            { id: 'shopping', title: 'shopping',  icon: 'checklist' },
            { id: 'pingpong', title: 'ping pong', icon: 'scoreboard' },
            { id: 'water',    title: 'hydration', icon: 'droplet' },
            { id: 'timer',    title: 'pomodoro',  icon: 'timer' },
            { id: 'notes',    title: 'notes',     icon: 'notes' },
            { id: 'habits',   title: 'habits',    icon: 'target' },
            { id: 'workout',  title: 'workout',   icon: 'dumbbell' },
            { id: 'budget',   title: 'expenses',  icon: 'chart' },
            { id: 'reading',  title: 'reading',   icon: 'book' },
            { id: 'energy',   title: 'focus',     icon: 'bolt' },
            { id: 'caffeine', title: 'caffeine',  icon: 'coffee' }
        ];
        const EXTRA_APP_POOL = [
            { id: 'compass',  title: 'wayfinder', icon: 'compass' },
            { id: 'mixer',    title: 'levels',    icon: 'sliders' },
            { id: 'meds',     title: 'vitamins',  icon: 'plus' },
            { id: 'tasks',    title: 'errands',   icon: 'checklist' }
        ];
        let appList = structuredClone(INITIAL_APPS);
        let appCursor = 1;

        let prevFrameData = null;

        const smileyBitmap = [
            0xC0, 0x03, 0x30, 0x0C, 0x08, 0x10, 0x04, 0x20,
            0x62, 0x46, 0x62, 0x46, 0x02, 0x40, 0x02, 0x40,
            0x02, 0x40, 0x02, 0x40, 0x22, 0x44, 0x44, 0x22,
            0x84, 0x21, 0x08, 0x10, 0x30, 0x0C, 0xC0, 0x03
        ];

        const OMNI_ARROWS = [
            { angle: -126, len: 58, headL: 18, headW: 11, shaftW: 4.5 },
            { angle: -52,  len: 48, headL: 16, headW: 10, shaftW: 4.5 },
            { angle: 15,   len: 58, headL: 18, headW: 11, shaftW: 4.5 },
            { angle: 90,   len: 50, headL: 16, headW: 10, shaftW: 4.5 },
            { angle: 162,  len: 46, headL: 16, headW: 10, shaftW: 4.5 }
        ];

        /**
         * Renders any 2D canvas path callback as pure 1-bit pixels via sim.drawPixel()
         * (zero grey anti-aliasing).
         */
        function drawCrisp1Bit(drawCallback, color = sim.foreground) {
            const off = document.createElement('canvas');
            off.width = DISPLAY_W;
            off.height = DISPLAY_H;
            const octx = off.getContext('2d');
            octx.clearRect(0, 0, DISPLAY_W, DISPLAY_H);
            octx.fillStyle = '#000';
            octx.strokeStyle = '#000';
            octx.lineCap = 'square';
            octx.lineJoin = 'miter';

            drawCallback(octx);

            const img = octx.getImageData(0, 0, DISPLAY_W, DISPLAY_H).data;
            for (let y = 0; y < DISPLAY_H; y++) {
                for (let x = 0; x < DISPLAY_W; x++) {
                    if (img[(y * DISPLAY_W + x) * 4 + 3] > 128) {
                        sim.drawPixel(x, y, color);
                    }
                }
            }
        }

        function drawOmniSymbol(cx, cy, scale = 1.0, opts = {}) {
            const color = opts.color || sim.foreground;
            const rotOffset = Number(opts.rotationDeg) || 0;
            const outerR = 22 * scale;
            const innerR = 11 * scale;

            drawCrisp1Bit((octx) => {
                OMNI_ARROWS.forEach((a, idx) => {
                    const isOrbitTarget = opts.activeArrowIdx === idx;
                    const lenBoost = isOrbitTarget ? 6 : 0;

                    const rad = ((a.angle + rotOffset) * Math.PI) / 180;
                    const ux = Math.cos(rad);
                    const uy = Math.sin(rad);
                    const px = -uy;
                    const py = ux;

                    const tipDist = (a.len + lenBoost) * scale;
                    const headL = a.headL * scale;
                    const headW = a.headW * scale;
                    const shaftW = a.shaftW * scale;

                    const startR = outerR - 4 * scale;
                    const hBaseR = tipDist - headL;

                    octx.beginPath();
                    octx.moveTo(cx + ux * startR + px * shaftW, cy + uy * startR + py * shaftW);
                    octx.lineTo(cx + ux * hBaseR + px * shaftW, cy + uy * hBaseR + py * shaftW);
                    octx.lineTo(cx + ux * hBaseR + px * headW,  cy + uy * hBaseR + py * headW);
                    octx.lineTo(cx + ux * tipDist,              cy + uy * tipDist);
                    octx.lineTo(cx + ux * hBaseR - px * headW,  cy + uy * hBaseR - py * headW);
                    octx.lineTo(cx + ux * hBaseR - px * shaftW, cy + uy * hBaseR - py * shaftW);
                    octx.lineTo(cx + ux * startR - px * shaftW, cy + uy * startR - py * shaftW);
                    octx.closePath();
                    octx.fill();
                });

                octx.beginPath();
                octx.arc(cx, cy, outerR, 0, Math.PI * 2);
                octx.fill();

                octx.globalCompositeOperation = 'destination-out';
                octx.beginPath();
                octx.arc(cx, cy, innerR, 0, Math.PI * 2);
                octx.fill();
                octx.globalCompositeOperation = 'source-over';

                if (opts.corePulse) {
                    octx.beginPath();
                    octx.arc(cx, cy, 6 * scale, 0, Math.PI * 2);
                    octx.fill();
                }
            }, color);
        }

        function drawAppIcon(iconType, cx, cy, fgColor, s = 1.0) {
            if (iconType === 'omni') {
                drawOmniSymbol(cx, cy, 0.36 * s, { color: fgColor });
                return;
            }

            drawCrisp1Bit((octx) => {
                octx.save();
                octx.translate(cx, cy);
                octx.scale(s, s);
                octx.lineWidth = 3;

                if (iconType === 'checklist') {
                    for (let i = -1; i <= 1; i++) {
                        const y = i * 10;
                        octx.fillRect(-16, y - 3, 6, 6);
                        octx.fillRect(-5, y - 2, 21, 3);
                    }
                } else if (iconType === 'scoreboard') {
                    octx.strokeRect(-17, -13, 14, 26);
                    octx.strokeRect(3, -13, 14, 26);
                    octx.fillRect(-12, -6, 4, 12);
                    octx.fillRect(8, -6, 4, 12);
                } else if (iconType === 'droplet') {
                    octx.beginPath();
                    octx.moveTo(0, -17);
                    octx.bezierCurveTo(14, 0, 14, 7, 12, 12);
                    octx.arc(0, 6, 12, 0.15 * Math.PI, 0.85 * Math.PI);
                    octx.bezierCurveTo(-14, 7, -14, 0, 0, -17);
                    octx.closePath();
                    octx.fill();
                    octx.globalCompositeOperation = 'destination-out';
                    octx.beginPath();
                    octx.arc(-4, 7, 3.5, 0, Math.PI * 2);
                    octx.fill();
                    octx.globalCompositeOperation = 'source-over';
                } else if (iconType === 'timer') {
                    octx.beginPath();
                    octx.arc(0, 2, 14, 0, Math.PI * 2);
                    octx.stroke();
                    octx.fillRect(-4, -16, 8, 3);
                    octx.beginPath();
                    octx.moveTo(0, 2);
                    octx.lineTo(0, -6);
                    octx.moveTo(0, 2);
                    octx.lineTo(7, 2);
                    octx.stroke();
                } else if (iconType === 'notes') {
                    octx.strokeRect(-13, -16, 26, 32);
                    octx.fillRect(-8, -8, 16, 3);
                    octx.fillRect(-8, -1, 16, 3);
                    octx.fillRect(-8, 6, 10, 3);
                } else if (iconType === 'target') {
                    octx.beginPath();
                    octx.arc(0, 0, 15, 0, Math.PI * 2);
                    octx.stroke();
                    octx.beginPath();
                    octx.arc(0, 0, 8, 0, Math.PI * 2);
                    octx.stroke();
                    octx.beginPath();
                    octx.arc(0, 0, 3, 0, Math.PI * 2);
                    octx.fill();
                } else if (iconType === 'dumbbell') {
                    octx.fillRect(-10, -2, 20, 4);
                    octx.fillRect(-15, -10, 5, 20);
                    octx.fillRect(10, -10, 5, 20);
                } else if (iconType === 'chart') {
                    octx.fillRect(-14, 2, 6, 12);
                    octx.fillRect(-3, -6, 6, 20);
                    octx.fillRect(8, -14, 6, 28);
                } else if (iconType === 'book') {
                    octx.strokeRect(-15, -12, 15, 24);
                    octx.strokeRect(0, -12, 15, 24);
                } else if (iconType === 'bolt') {
                    octx.beginPath();
                    octx.moveTo(3, -17);
                    octx.lineTo(-11, 2);
                    octx.lineTo(-1, 2);
                    octx.lineTo(-4, 17);
                    octx.lineTo(11, -2);
                    octx.lineTo(1, -2);
                    octx.closePath();
                    octx.fill();
                } else if (iconType === 'coffee') {
                    octx.strokeRect(-13, -7, 20, 18);
                    octx.beginPath();
                    octx.arc(7, 2, 6, -Math.PI / 2, Math.PI / 2);
                    octx.stroke();
                    octx.fillRect(-15, 13, 24, 3);
                } else if (iconType === 'compass') {
                    octx.beginPath();
                    octx.arc(0, 0, 15, 0, Math.PI * 2);
                    octx.stroke();
                    octx.beginPath();
                    octx.moveTo(7, -7);
                    octx.lineTo(3, 3);
                    octx.lineTo(-7, 7);
                    octx.lineTo(-3, -3);
                    octx.closePath();
                    octx.fill();
                } else if (iconType === 'sliders') {
                    for (let i = -1; i <= 1; i++) {
                        const x = i * 10;
                        octx.fillRect(x - 1, -14, 3, 28);
                        const knobY = i === 0 ? -5 : 5;
                        octx.fillRect(x - 4, knobY - 3, 9, 6);
                    }
                } else {
                    octx.fillRect(-12, -2, 24, 5);
                    octx.fillRect(-2, -12, 5, 24);
                }
                octx.restore();
            }, fgColor);
        }

        /**
         * Helper: Draws a circular badge node (either solid inverted or outlined with cleared interior)
         * and draws the 1-bit app icon inside it.
         */
        function drawCircularIconNode(cx, cy, radius, iconType, isSelected, iconScale) {
            if (isSelected) {
                drawCrisp1Bit((octx) => {
                    octx.beginPath();
                    octx.arc(cx, cy, radius, 0, Math.PI * 2);
                    octx.fill();
                }, sim.foreground);
                drawAppIcon(iconType, cx, cy, sim.background, iconScale);
            } else {
                // Clear white circle interior first so arc/spoke lines behind it don't bleed through
                drawCrisp1Bit((octx) => {
                    octx.beginPath();
                    octx.arc(cx, cy, radius, 0, Math.PI * 2);
                    octx.fill();
                }, sim.background);
                drawCrisp1Bit((octx) => {
                    octx.lineWidth = 2.5;
                    octx.beginPath();
                    octx.arc(cx, cy, radius, 0, Math.PI * 2);
                    octx.stroke();
                }, sim.foreground);
                drawAppIcon(iconType, cx, cy, sim.foreground, iconScale);
            }
        }

        const neuroTextCache = new Map();
        function drawNeuropoliticalText(text, xPos, topY, fontSizePx, color = sim.foreground, align = 'center') {
            const cacheKey = `${text}:${fontSizePx}:${align}:${xPos}:${topY}`;
            let pts = neuroTextCache.get(cacheKey);
            if (!pts) {
                const off = document.createElement('canvas');
                off.width = DISPLAY_W;
                off.height = fontSizePx * 2;
                const octx = off.getContext('2d');
                octx.clearRect(0, 0, off.width, off.height);
                octx.fillStyle = '#000';
                octx.font = `${fontSizePx}px 'Neuropolitical', sans-serif`;
                octx.textBaseline = 'top';

                const metrics = octx.measureText(text);
                let startX = xPos;
                if (align === 'center') startX = Math.round(xPos - metrics.width / 2);
                else if (align === 'right') startX = Math.round(xPos - metrics.width);

                const padY = 4;
                octx.fillText(text, startX, padY);

                const img = octx.getImageData(0, 0, off.width, off.height).data;
                pts = [];
                for (let y = 0; y < off.height; y++) {
                    for (let x = 0; x < off.width; x++) {
                        if (img[(y * off.width + x) * 4 + 3] > 120) {
                            pts.push([x, topY + y - padY]);
                        }
                    }
                }
                neuroTextCache.set(cacheKey, pts);
            }
            for (let i = 0; i < pts.length; i++) {
                const p = pts[i];
                sim.drawPixel(p[0], p[1], color);
            }
        }

        function drawAgentHomeView(animOpts = {}) {
            sim.clear();
            drawOmniSymbol(150, 165, 1.15, animOpts);
            drawNeuropoliticalText('omni', 150, 248, 34, sim.foreground, 'center');
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // 5 ROTARY WHEEL ARC DESIGNS
        // ═══════════════════════════════════════════════════════════════════════════

        /**
         * Arc 1: 5-Node Right Thumbwheel Dial
         * Smooth curve anchored off the right edge (cx=370, cy=200, R=182).
         * Shows 5 graduated icon nodes (-2, -1, 0, +1, +2) with the active node
         * projecting furthest left at y=200 and the lowercase title aligned on the left.
         */
        function drawWheelArc1_FiveNodeRight() {
            sim.clear();
            const n = appList.length;
            const arcCx = 370;
            const arcCy = 200;
            const arcR = 182;

            // Draw main arc rail
            drawCrisp1Bit((octx) => {
                octx.lineWidth = 2;
                octx.beginPath();
                octx.arc(arcCx, arcCy, arcR, (180 - 52) * Math.PI / 180, (180 + 52) * Math.PI / 180);
                octx.stroke();
            }, sim.foreground);

            const slots = [
                { offset: -2, angleDeg: 180 + 42, r: 16, scale: 0.48, active: false },
                { offset: -1, angleDeg: 180 + 22, r: 23, scale: 0.72, active: false },
                { offset:  0, angleDeg: 180,      r: 36, scale: 1.20, active: true  },
                { offset:  1, angleDeg: 180 - 22, r: 23, scale: 0.72, active: false },
                { offset:  2, angleDeg: 180 - 42, r: 16, scale: 0.48, active: false }
            ];

            slots.forEach((slot) => {
                const idx = (appCursor + slot.offset + n * 10) % n;
                const app = appList[idx];
                const rad = (slot.angleDeg * Math.PI) / 180;
                const cx = Math.round(arcCx + Math.cos(rad) * arcR);
                const cy = Math.round(arcCy + Math.sin(rad) * arcR);
                drawCircularIconNode(cx, cy, slot.r, app.icon, slot.active, slot.scale);

        /**
         * Arc 2: Omni Spoke Hub Arc ("Half-Sunburst")
         * Inspired by the 5-Arrow Omni logo: a central hub anchored on the right edge
         * (cx=306, cy=200) radiates 5 straight spokes out to 5 icon nodes along an arc!
         */
        function drawWheelArc2_OmniSpokeHub() {
            sim.clear();
            const n = appList.length;
            const hubCx = 308;
            const hubCy = 200;
            const spokeR = 128;

            const slots = [
                { offset: -2, angleDeg: 180 + 54, r: 18, scale: 0.54, active: false },
                { offset: -1, angleDeg: 180 + 27, r: 23, scale: 0.72, active: false },
                { offset:  0, angleDeg: 180,      r: 36, scale: 1.20, active: true  },
                { offset:  1, angleDeg: 180 - 27, r: 23, scale: 0.72, active: false },
                { offset:  2, angleDeg: 180 - 54, r: 18, scale: 0.54, active: false }
            ];

            // Draw radiating spokes from the right-edge hub + hub ring
            drawCrisp1Bit((octx) => {
                slots.forEach((slot) => {
                    const rad = (slot.angleDeg * Math.PI) / 180;
                    const tx = hubCx + Math.cos(rad) * spokeR;
                    const ty = hubCy + Math.sin(rad) * spokeR;
                    octx.lineWidth = slot.active ? 5 : 2;
                    octx.beginPath();
                    octx.moveTo(hubCx, hubCy);
                    octx.lineTo(tx, ty);
                    octx.stroke();
                });

                // Outer hub ring on right edge
                octx.beginPath();
                octx.arc(hubCx, hubCy, 34, 0, Math.PI * 2);
                octx.fill();

                octx.globalCompositeOperation = 'destination-out';
                octx.beginPath();
                octx.arc(hubCx, hubCy, 17, 0, Math.PI * 2);
                octx.fill();
                octx.globalCompositeOperation = 'source-over';
            }, sim.foreground);

            // Draw the 5 icon nodes at the end of each spoke
            slots.forEach((slot) => {
                const idx = (appCursor + slot.offset + n * 10) % n;
                const app = appList[idx];
                const rad = (slot.angleDeg * Math.PI) / 180;
                const cx = Math.round(hubCx + Math.cos(rad) * spokeR);
                const cy = Math.round(hubCy + Math.sin(rad) * spokeR);
                drawCircularIconNode(cx, cy, slot.r, app.icon, slot.active, slot.scale);
            });

            // Focused app title cleanly centered on the left of the horizontal active spoke
            const activeApp = appList[appCursor];
            drawNeuropoliticalText(activeApp.title, 72, 189, 20, sim.foreground, 'center');
        }

        /**
         * Arc 4: Precision Mechanical Detent Ring ("Camera Dial / Bezel")
         * A rotary tick-mark ring along the right side with frameless icons orbiting
         * just outside the detents, and a bold inverted focus window at y=200.
         */
        function drawWheelArc4_DetentRing() {
            sim.clear();
            const n = appList.length;
            const dialCx = 395;
            const dialCy = 200;
            const tickInnerR = 156;
            const tickOuterR = 166;
            const iconOrbitR = 208;

            // Draw precision radial detent ticks along the right bezel
            drawCrisp1Bit((octx) => {
                for (let deg = 132; deg <= 228; deg += 4) {
                    const rad = (deg * Math.PI) / 180;
                    const isMajor = (deg - 180) % 20 === 0;
                    const r0 = isMajor ? tickInnerR - 5 : tickInnerR;
                    const r1 = tickOuterR;
                    octx.lineWidth = isMajor ? 2.5 : 1.5;
                    octx.beginPath();
                    octx.moveTo(dialCx + Math.cos(rad) * r0, dialCy + Math.sin(rad) * r0);
                    octx.lineTo(dialCx + Math.cos(rad) * r1, dialCy + Math.sin(rad) * r1);
                    octx.stroke();
                }

                // Triangular pointer notch at 180° (y=200)
                octx.beginPath();
                octx.moveTo(dialCx - tickOuterR - 4, 200);
                octx.lineTo(dialCx - tickOuterR + 8, 193);
                octx.lineTo(dialCx - tickOuterR + 8, 207);
                octx.closePath();
                octx.fill();
            }, sim.foreground);

            const slots = [
                { offset: -2, angleDeg: 180 + 36, scale: 0.62, active: false },
                { offset: -1, angleDeg: 180 + 18, scale: 0.85, active: false },
                { offset:  0, angleDeg: 180,      scale: 1.35, active: true  },
                { offset:  1, angleDeg: 180 - 18, scale: 0.85, active: false },
                { offset:  2, angleDeg: 180 - 36, scale: 0.62, active: false }
            ];

            slots.forEach((slot) => {
                const idx = (appCursor + slot.offset + n * 10) % n;
                const app = appList[idx];
                const rad = (slot.angleDeg * Math.PI) / 180;
                const cx = Math.round(dialCx + Math.cos(rad) * iconOrbitR);
                const cy = Math.round(dialCy + Math.sin(rad) * iconOrbitR);

                if (slot.active) {
                    drawCircularIconNode(cx, cy, 36, app.icon, true, slot.scale);
                } else {
                    // Frameless floating icons along the curve
                    drawAppIcon(app.icon, cx, cy, sim.foreground, slot.scale);
                }
            });

            // Clean lowercase title on left
            const activeApp = appList[appCursor];
            drawNeuropoliticalText(activeApp.title, 20, 189, 21, sim.foreground, 'left');
        }

        function drawGraphDemo() {
            sim.clear();
            sim.drawText('24-Hour Sensor Data', 15, 28, SF_Pro_Display_Bold10pt7b);

            const data = [];
            for (let i = 0; i < 24; i++) {
                data.push(50 + Math.sin(i * 0.5) * 30 + Math.random() * 10);
            }
            const gX = 25, gY = 55, gW = 250, gH = 240;
            sim.drawLine(gX, gY, gX, gY + gH);
            sim.drawLine(gX, gY + gH, gX + gW, gY + gH);
            const minV = Math.min(...data), maxV = Math.max(...data);
            const range = maxV - minV || 1;
            for (let i = 0; i < data.length; i++) {
                const x = gX + (i * gW) / (data.length - 1);
                const y = gY + gH - ((data[i] - minV) / range) * gH;
                if (i > 0) {
                    const px = gX + ((i - 1) * gW) / (data.length - 1);
                    const py = gY + gH - ((data[i - 1] - minV) / range) * gH;
                    sim.drawLine(Math.round(px), Math.round(py), Math.round(x), Math.round(y));
                }
                sim.fillCircle(Math.round(x), Math.round(y), 3, RED);
            }
            sim.drawText('Peak points in Red', 25, 330, SFMono_Bold8pt7b, RED);
        }

            sim.drawXBitmapScaled(160, 85, smileyBitmap, 16, 16, 96, 96);

            sim.drawRect(15, 200, 270, 120);
            for (let y = 204; y < 316; y += 4) {
                for (let x = 19; x < 281; x += 4) {
                    const c = ((x + y) % 8 === 0) ? RED : sim.foreground;
                    sim.drawPixel(x, y, c);
                    sim.drawPixel(x + 1, y, c);
                    sim.drawPixel(x, y + 1, c);
                    sim.drawPixel(x + 1, y + 1, c);
                }
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // E-INK REFRESH WAVEFORM EFFECT (Full Tri-Color Flash & Realistic B/W Partial)
        // ═══════════════════════════════════════════════════════════════════════════

        function playFullRefreshWaveform(targetImageData, oldImageData, durationMs) {
            if (waveformRAF) cancelAnimationFrame(waveformRAF);
            partialCountSinceFull = 0;
            const ctx = sim.getContext().ctx;
            const badge = document.getElementById('refreshBadge');
            badge.textContent = 'FULL TRI-COLOR REFRESH';
            badge.classList.add('active');

            const start = performance.now();
            const w = DISPLAY_W, h = DISPLAY_H;

            function step(now) {
                const t = Math.min(1, (now - start) / durationMs);
                const frame = ctx.createImageData(w, h);
                const dst = frame.data;
                const tgt = targetImageData.data;
                const old = oldImageData ? oldImageData.data : tgt;

                for (let i = 0; i < dst.length; i += 4) {
                    const tr = tgt[i], tg = tgt[i + 1], tb = tgt[i + 2];
                    const or = old[i], og = old[i + 1], ob = old[i + 2];
                    const isTargetRed = tr > 150 && tg < 60 && tb < 60;
                    const isTargetBlack = tr < 50 && tg < 50 && tb < 50;

                    let r = 255, g = 255, b = 255;

                    if (t < 0.14) {
                        r = 255 - or; g = 255 - og; b = 255 - ob;
                    } else if (t < 0.28) {
                        r = 18; g = 18; b = 18;
                    } else if (t < 0.44) {
                        r = 250; g = 250; b = 250;
                    } else if (t < 0.62) {
                        r = isTargetBlack ? 240 : 25;
                        g = isTargetBlack ? 240 : 25;
                        b = isTargetBlack ? 240 : 25;
                    } else if (t < 0.80) {
                        if (isTargetBlack) {
                            r = 0; g = 0; b = 0;
                        } else if (isTargetRed) {
                            const pulse = Math.sin((t - 0.62) * 35) > 0;
                            r = pulse ? 220 : 120;
                            g = pulse ? 90 : 30;
                            b = pulse ? 90 : 30;
                        } else {
                            r = 255; g = 255; b = 255;
                        }
                    } else {
                        r = tr; g = tg; b = tb;
                    }

                    dst[i] = r;
                    dst[i + 1] = g;
                    dst[i + 2] = b;
                    dst[i + 3] = 255;
                }

                ctx.putImageData(frame, 0, 0);

                if (t < 1) {
                    waveformRAF = requestAnimationFrame(step);
                } else {
                    ctx.putImageData(targetImageData, 0, 0);
                    prevFrameData = targetImageData;
                    badge.classList.remove('active');
                    waveformRAF = null;
                }
            }

            waveformRAF = requestAnimationFrame(step);
        }

        function playPartialWindowRefresh(targetImageData, oldImageData, wx, wy, ww, wh, durationMs) {
            if (waveformRAF) cancelAnimationFrame(waveformRAF);
            partialCountSinceFull += 1;
            const ctx = sim.getContext().ctx;
            const badge = document.getElementById('refreshBadge');
            badge.textContent = `PARTIAL #${partialCountSinceFull} (${ww}×${wh}px • ~1.7 FPS)`;
            badge.classList.add('active');

            const start = performance.now();
            const w = DISPLAY_W, h = DISPLAY_H;
            const tgt = targetImageData.data;
            const old = oldImageData ? oldImageData.data : tgt;

            const xEnd = Math.min(w, wx + ww);
            const yEnd = Math.min(h, wy + wh);

            function step(now) {
                const t = Math.min(1, (now - start) / durationMs);
                const frame = ctx.createImageData(w, h);
                const dst = frame.data;
                dst.set(old);

                for (let y = Math.max(0, wy); y < yEnd; y++) {
                    for (let x = Math.max(0, wx); x < xEnd; x++) {
                        const idx = (y * w + x) * 4;
                        const tr = tgt[idx], tg = tgt[idx + 1], tb = tgt[idx + 2];
                        const or = old[idx], og = old[idx + 1], ob = old[idx + 2];

                        if (tr === or && tg === og && tb === ob) {
                            dst[idx] = tr; dst[idx + 1] = tg; dst[idx + 2] = tb; dst[idx + 3] = 255;
                            continue;
                        }

                        if (t < 0.28) {
                            dst[idx] = 255 - tr;
                            dst[idx + 1] = 255 - tg;
                            dst[idx + 2] = 255 - tb;
                            dst[idx + 3] = 255;
                        } else {
                            dst[idx] = tr;
                            dst[idx + 1] = tg;
                            dst[idx + 2] = tb;
                            dst[idx + 3] = 255;
                        }
                    }
                }

                ctx.putImageData(frame, 0, 0);

                if (t < 1) {
                    waveformRAF = requestAnimationFrame(step);
                } else {
                    ctx.putImageData(targetImageData, 0, 0);
                    prevFrameData = targetImageData;
                    badge.classList.remove('active');
                    waveformRAF = null;
                }
            }

            waveformRAF = requestAnimationFrame(step);
        }

        function drawCurrentScene(animOpts = {}) {
            const scene = document.getElementById('scene').value;
            switch (scene) {
                case 'agent': drawAgentHomeView(animOpts); break;
                case 'apps': drawAppSelectionView(); break;
                case 'shapes': drawShapesDemo(); break;
                case 'text': drawTextDemo(); break;
                case 'bitmap': drawBitmapDemo(); break;
                case 'graph': drawGraphDemo(); break;
            }
        }

        function render(refreshType = 'full', animOpts = {}, partialBox = null) {
            const mode = document.getElementById('mode').value;
            const waveformMode = document.getElementById('waveformMode').value;
            const isDark = mode === 'dark';

            sim = new EinkSimulator(document.getElementById('display'), {
                width: DISPLAY_W,
                height: DISPLAY_H,
                foreground: isDark ? '#FFFFFF' : '#000000',
                background: isDark ? '#000000' : '#FFFFFF',
                accent: RED
            });
            sim.setScale(currentScale);

            drawCurrentScene(animOpts);

            const ctx = sim.getContext().ctx;
            const targetImageData = ctx.getImageData(0, 0, DISPLAY_W, DISPLAY_H);

            if (waveformMode === 'instant') {
                prevFrameData = targetImageData;
                return;
            }

            if (refreshType === 'partial') {
                const box = partialBox || { x: 0, y: 0, w: DISPLAY_W, h: DISPLAY_H };
                const dur = waveformMode === 'hardware' ? 550 : 440;
                playPartialWindowRefresh(targetImageData, prevFrameData, box.x, box.y, box.w, box.h, dur);
            } else {
                const dur = waveformMode === 'hardware' ? 10000 : 2200;
                playFullRefreshWaveform(targetImageData, prevFrameData, dur);
            }
        }

        function scrollApps(dir) {
            const sceneEl = document.getElementById('scene');
            if (sceneEl.value === 'agent') {
                stopAnim();
                sceneEl.value = 'apps';
                render('partial', {}, { x: 0, y: 0, w: DISPLAY_W, h: DISPLAY_H });
                return;
            }
            if (sceneEl.value !== 'apps') return;

            appCursor = (appCursor + dir + appList.length) % appList.length;
            render('partial', {}, { x: 10, y: 20, w: DISPLAY_W - 10, h: DISPLAY_H - 40 });
        }

        function pressWheel() {
            const sceneEl = document.getElementById('scene');
            if (sceneEl.value === 'agent') {
                stopAnim();
                sceneEl.value = 'apps';
                render('partial', {}, { x: 0, y: 0, w: DISPLAY_W, h: DISPLAY_H });
            } else if (sceneEl.value === 'apps') {
                sceneEl.value = 'agent';
                render('partial', {}, { x: 0, y: 0, w: DISPLAY_W, h: DISPLAY_H });
            }
        }

        function addGeneratedApp() {
            const nextPoolItem = EXTRA_APP_POOL[(appList.length - INITIAL_APPS.length) % EXTRA_APP_POOL.length];
            const suffix = appList.length >= INITIAL_APPS.length + EXTRA_APP_POOL.length
                ? ' ' + (Math.floor((appList.length - INITIAL_APPS.length) / EXTRA_APP_POOL.length) + 2)
                : '';
            appList.push({
                id: nextPoolItem.id + '_' + appList.length,
                title: nextPoolItem.title + suffix,
                icon: nextPoolItem.icon
            });
            appCursor = appList.length - 1;
            document.getElementById('scene').value = 'apps';
            render('partial', {}, { x: 10, y: 20, w: DISPLAY_W - 10, h: DISPLAY_H - 40 });
        }

        function resetApps() {
            appList = structuredClone(INITIAL_APPS);
            appCursor = 1;
            document.getElementById('scene').value = 'apps';
            render('partial', {}, { x: 10, y: 20, w: DISPLAY_W - 10, h: DISPLAY_H - 40 });
        }

        window.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '9') {
                setAppLayout(Number(e.key));
                return;
            }
            if (e.key === '0') {
                setAppLayout(10);
                return;
            }
            if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'w' || e.key === 'W') {
                e.preventDefault();
                scrollApps(-1);
            } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 's' || e.key === 'S') {
                e.preventDefault();
                scrollApps(1);
            } else if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                pressWheel();
            } else if (e.key === 'Escape' || e.key === 'Backspace') {
                e.preventDefault();
                stopAnim();
                document.getElementById('scene').value = 'agent';
                render('partial', {}, { x: 0, y: 0, w: DISPLAY_W, h: DISPLAY_H });
            }
        });

        function toggleAnim(type) {
            if (activeAnim === type) {
                stopAnim();
                return;
            }
            stopAnim();
            document.getElementById('scene').value = 'agent';
            activeAnim = type;
            animStep = 0;

            document.getElementById('btnAnimSpin')?.classList.toggle('active-anim', type === 'spin');
            document.getElementById('btnAnimPulse')?.classList.toggle('active-anim', type === 'pulse');
            document.getElementById('btnAnimOrbit')?.classList.toggle('active-anim', type === 'orbit');

            const tick = () => {
                if (type === 'spin') {
                    spinAngleDeg = (spinAngleDeg + 24) % 360;
                    render('partial', { rotationDeg: spinAngleDeg }, { x: 74, y: 89, w: 152, h: 152 });
                } else if (type === 'pulse') {
                    animStep = (animStep + 1) % 2;
                    render('partial', { rotationDeg: spinAngleDeg, corePulse: animStep === 1 }, { x: 125, y: 140, w: 50, h: 50 });
                } else if (type === 'orbit') {
                    animStep = (animStep + 1) % 5;
                    render('partial', { rotationDeg: spinAngleDeg, activeArrowIdx: animStep }, { x: 70, y: 85, w: 160, h: 160 });
                }
            };

            tick();
            animTimer = setInterval(tick, 580);
        }

        function stopAnim() {
            activeAnim = null;
            if (animTimer) {
                clearInterval(animTimer);
                animTimer = null;
            }
            document.getElementById('btnAnimSpin')?.classList.remove('active-anim');
            document.getElementById('btnAnimPulse')?.classList.remove('active-anim');
            document.getElementById('btnAnimOrbit')?.classList.remove('active-anim');
        }

        function setScale(s) {
            currentScale = s;
            sim.setScale(s);
            const frame = document.querySelector('.display-frame');
            frame.style.width = (DISPLAY_W * s + 44) + 'px';
            frame.style.height = (DISPLAY_H * s + 44) + 'px';
        }

        window.onload = async function() {
            try {
                const neuroFont = new FontFace('Neuropolitical', 'url(./dist/neuropolitical.woff)');
                const loaded = await neuroFont.load();
                document.fonts.add(loaded);
            } catch (e) {
                console.warn('Could not preload Neuropolitical font:', e);
            }
            render('full');
            setScale(currentScale);
        };
    </script>
